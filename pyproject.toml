[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aphelion-plugin-sdk"
dynamic = ["version"]
description = "Product-scoped SDK for Aphelion Editor nodes, audio, custom UI and extensions."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "youthx" }]
keywords = ["aphelion", "plugin", "sdk", "video", "audio"]
dependencies = ["numpy>=1.26.0"]

[project.scripts]
aphelion-sdk = "aphelion_sdk.cli.main:main"

[project.urls]
Homepage = "https://github.com/aphelion-engine/aphelion-sdk"
Repository = "https://github.com/aphelion-engine/aphelion-sdk"

[project.optional-dependencies]
dev = ["build>=1.2.0", "pytest>=8.0.0", "mypy>=1.8.0"]

[tool.setuptools.dynamic]
version = {attr = "aphelion_sdk.version.__version__"}

[tool.setuptools.packages.find]
include = ["aphelion_sdk*"]
exclude = ["examples*"]

[tool.setuptools.package-data]
aphelion_sdk = ["py.typed", "editor/*.pyi"]
[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "../aphelion-editor/src"
explicit_package_bases = true
namespace_packages = true

[tool.pyrefly]
search-path = [".", "../aphelion-editor/src"]
project-includes = ["aphelion_sdk", "examples"]
project-excludes = [".venv", "build", "dist"]

[tool.pyright]
include = ["aphelion_sdk", "examples"]
extraPaths = [".", "../aphelion-editor/src"]
exclude = [".venv", "build", "dist"]
pythonVersion = "3.11"
